
<!DOCTYPE html>
<html>
<head>
    <title>Conference Registration Form</title>
</head>
<body>
<h2>Conference Registration Form</h2>

<form>
    <label for="fullname"><b>Full Name:</b></label>
    <br>
    <input type="text" id="fullname" name="fullname"
        placeholder="Enter your full name" required>
    <br>

    <label for="email"><b>Email Address:</b></label>
    <br>
    <input type="email" id="email" name="email"
        placeholder="Enter your email address" required>
    <br>

    <label for="age"><b>Age:</b></label>
    <br>
    <input type="number" id="age" name="age"
        min="18" max="99" value="18" required>
    <br><br>

    <label>Gender:</label>
    <br><br>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>
    <br>

    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>
    <br><br>

    
    <label for="country">Country of Residence:</label>
    <br>

    <select id="country" name="country">
    <option value="Malaysia" selected>Malaysia</option>
    <option value="Singapore">Singapore</option>
    <option value="Indonesia">Indonesia</option>
    </select>
    <br><br>

    <label for="Interest">Areas of Interest:</label>
    <br><br>

    <input type="checkbox" id="software" name="interest" value="Software Development">
    <label for="software">Software Development</label>
    <br>

    <input type="checkbox" id="data" name="interest" value="Data Science">
    <label for="data">Data Science</label>
    <br>

    <input type="checkbox" id="cyber" name="interest" value="Cybersecurity">
    <label for="cyber">Cybersecurity</label>
    <br>

    <input type="checkbox" id="ai" name="interest" value="Artificial Intelligence">
    <label for="ai">Artificial Intelligence</label>
    <br><br>

    <label for="Experience">Experience Level:</label>
    <br><br>

    <input type="radio" id="beginner" name="experience" value="Beginner">
    <label for="beginner">Beginner</label>
    <br>

    <input type="radio" id="intermediate" name="experience" value="Intermediate">
    <label for="intermediate">Intermediate</label>
    <br>

    <input type="radio" id="advanced" name="experience" value="Advanced">
    <label for="advanced">Advanced</label>
    <br><br>

    
    <label for="comments">Comments or Questions:</label>
    <br>

    <textarea id="comments" name="comments"
        rows="6" cols="50"
        placeholder="Any comments or questions?"></textarea>
    <br>

    <button type="submit">Register</button>
    <button type="reset">Reset</button>

</form>

</body>
</html>
